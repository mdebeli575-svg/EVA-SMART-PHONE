## Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
## Create the schema first in phpMyAdmin:
##   CREATE DATABASE eva_mobile CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/eva_mobile?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Addis_Ababa
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
