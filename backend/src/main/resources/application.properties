## ---------------------------------------------------------------------------
## Eva Mobile API - local development configuration
## ---------------------------------------------------------------------------
server.port=8080
spring.application.name=eva-mobile-api

## File-backed H2 database, no install required. Data survives restarts in ./data
spring.datasource.url=jdbc:h2:file:./data/evamobile;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Addis_Ababa

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

## Admin dashboard key. The browser sends it as the X-Admin-Key header.
## CHANGE THIS before exposing the API to a network.
eva.admin.key=eva-admin-demo-key

## Uploaded product photos. Files land in ./uploads and are served at /uploads/**.
eva.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

## sandbox | live
eva.payments.mode=sandbox
eva.payments.sandbox.pin=1234

## --- Telebirr H5 (fill these when going live) -----------------------------
eva.payments.telebirr.app-id=
eva.payments.telebirr.app-key=
eva.payments.telebirr.short-code=
eva.payments.telebirr.public-key=
eva.payments.telebirr.private-key=
eva.payments.telebirr.notify-url=http://localhost:8080/api/payments/telebirr/callback
eva.payments.telebirr.return-url=http://localhost:8080/pay-return.html

## --- CBE Birr merchant (fill these when going live) -----------------------
eva.payments.cbe.merchant-id=
eva.payments.cbe.merchant-key=
eva.payments.cbe.base-url=
eva.payments.cbe.notify-url=http://localhost:8080/api/payments/cbe/callback
eva.payments.cbe.return-url=http://localhost:8080/pay-return.html

logging.level.com.evamobile=INFO
